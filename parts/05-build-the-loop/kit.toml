# correct-the-error: the first query for each question has a mistake on purpose.
# A rewrite fixes one mistake, and only when it is told the error that names it.
[[broken]]
question = "How many sellers are in the state of Sao Paulo?"
first_sql = "SELECT COUNT(*) AS sellers FROM sellers WHERE seller_st = 'SP'"
fixes = [
  { error_mentions = "seller_st", sql = "SELECT COUNT(*) AS sellers FROM sellers WHERE seller_state = 'SP'" },
]

[[broken]]
question = "How many orders were delivered?"
first_sql = "SELECT COUNT(*) AS orders FROM orders WHERE status = 'delivered'"
fixes = [
  { error_mentions = "status", sql = "SELECT COUNT(*) AS orders FROM orders WHERE order_status = 'delivered'" },
]

[[broken]]
question = "What share of payment value came from each payment type?"
first_sql = """
SELECT payment_type, ROUND(100.0 * SUM(payment_value) / (SELECT SUM(payment_value) FROM order_payments), 2) AS pct
FROM order_payments WHERE payment_type IN ('Credit Card', 'Boleto', 'Voucher', 'Debit Card') GROUP BY payment_type
"""
fixes = [
  { error_mentions = "no rows", sql = """
SELECT payment_type, ROUND(100.0 * SUM(payment_value) / (SELECT SUM(payment_value) FROM order_payments), 2) AS pct
FROM order_payments GROUP BY payment_type
""" },
]

[[broken]]
question = "What is the average review score?"
first_sql = "SELECT ROUND(AVG(score), 2) AS avg_score FROM order_reviews"
fixes = [
  { error_mentions = "score", sql = "SELECT ROUND(AVG(review_score), 2) AS avg_score FROM order_reviews WHERE review_answer_time IS NOT NULL" },
  { error_mentions = "review_answer_time", sql = "SELECT ROUND(AVG(review_score), 2) AS avg_score FROM order_reviews WHERE review_answer_timestamp IS NOT NULL" },
]

# This one has three mistakes. With at most 2 retries it stays broken, and that is the right outcome.
[[broken]]
question = "How many orders placed in 2018 were delivered late?"
first_sql = """
SELECT COUNT(*) AS late_orders FROM orders WHERE substr(purchase_timestamp, 1, 4) = '2018'
  AND delivered_date IS NOT NULL AND date(delivered_date) > date(estimated_date)
"""
fixes = [
  { error_mentions = "purchase_timestamp", sql = """
SELECT COUNT(*) AS late_orders FROM orders WHERE substr(order_purchase_timestamp, 1, 4) = '2018'
  AND delivered_date IS NOT NULL AND date(delivered_date) > date(estimated_date)
""" },
  { error_mentions = "delivered_date", sql = """
SELECT COUNT(*) AS late_orders FROM orders WHERE substr(order_purchase_timestamp, 1, 4) = '2018'
  AND order_delivered_customer_date IS NOT NULL AND date(order_delivered_customer_date) > date(estimated_date)
""" },
  { error_mentions = "estimated_date", sql = """
SELECT COUNT(*) AS late_orders FROM orders WHERE substr(order_purchase_timestamp, 1, 4) = '2018'
  AND order_delivered_customer_date IS NOT NULL
  AND date(order_delivered_customer_date) > date(order_estimated_delivery_date)
""" },
]

