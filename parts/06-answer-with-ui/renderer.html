<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ops desk</title>
<style>
  :root { --ink: #1f2937; --soft: #6b7280; --line: #e5e7eb; --accent: #2563eb; --card: #f9fafb; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: var(--ink); background: #fff; overflow-wrap: anywhere; }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 24px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  form label { flex-basis: 100%; font-weight: 600; }
  form input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  form button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; }
  .layout { display: grid; grid-template-columns: 1fr 260px; gap: 20px; }
  .events { font: 12px/1.6 ui-monospace, monospace; color: var(--soft); border-left: 1px solid var(--line); padding-left: 14px; }
  .events b { color: var(--ink); font-weight: 600; }
  .column > * { margin-bottom: 14px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--soft); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .card h3 { margin: 0 0 6px; font-size: 13px; color: var(--soft); }
  .quote p { margin: 0; font-style: italic; }
  .quote small { color: var(--soft); }
  .waiting { color: var(--soft); }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .events { border-left: 0; padding-left: 0; } }
</style>
</head>
<body>
<main>
  <h1>Ops desk</h1>
  <form id="ask">
    <label for="question">Your question</label>
    <input id="question" value="Which Sao Paulo sellers had the most late deliveries in 2018?">
    <button type="submit">Ask the desk</button>
  </form>
  <div class="layout">
    <div id="surface" class="waiting">Ask a question to see the answer.</div>
    <div id="events" class="events"></div>
  </div>
</main>
<script>
// The provided renderer. It draws A2UI v1.0 messages with the course catalog only.
// It never inserts HTML from the agent: every value is set as text.
const PRESET_MESSAGES = null;
const PALETTE = ["#2563eb", "#d97706", "#059669", "#db2777", "#7c3aed"];
const surfaces = {};

function pointerGet(model, path) {
  const steps = path.split("/").filter(Boolean);
  return steps.reduce((value, step) => (value == null ? undefined : value[step]), model);
}

function resolved(surface, value) {
  if (value && typeof value === "object" && "@path" in value) {
    return pointerGet(surface.dataModel, value["@path"]);
  }
  return value;
}

function apply(message) {
  if (message.createSurface) {
    const created = message.createSurface;
    surfaces[created.surfaceId] = { components: {}, dataModel: created.dataModel || {} };
    for (const component of created.components || []) surfaces[created.surfaceId].components[component.id] = component;
  } else if (message.updateComponents) {
    const surface = surfaces[message.updateComponents.surfaceId];
    for (const component of message.updateComponents.components) surface.components[component.id] = component;
  } else if (message.updateDataModel) {
    const surface = surfaces[message.updateDataModel.surfaceId];
    surface.dataModel = message.updateDataModel.value;
  }
}

function element(tag, text, className) {
  const made = document.createElement(tag);
  if (text !== undefined) made.textContent = text;
  if (className) made.className = className;
  return made;
}

function plainWords(name) {
  return String(name).replaceAll("_", " ");
}

function drawTable(surface, component) {
  const table = element("table");
  const head = element("thead");
  const header = element("tr");
  for (const column of resolved(surface, component.columns) || []) {
    header.append(element("th", plainWords(column)));
  }
  const body = element("tbody");
  for (const row of resolved(surface, component.rows) || []) {
    const line = element("tr");
    for (const cell of row) line.append(element("td", cell));
    body.append(line);
  }
  head.append(header);
  table.append(head, body);
  const wrapper = element("div", undefined, "scroll");
  wrapper.append(table);
  return wrapper;
}

function drawChart(surface, component) {
  const points = resolved(surface, component.points) || [];
  const xs = [...new Set(points.map((point) => point[component.x]))].sort();
  const series = [...new Set(points.map((point) => point[component.series] ?? "all"))];
  const top = Math.max(1, ...points.map((point) => Number(point[component.y])));
  const width = 640, height = 220, left = 36, bottom = 24;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("width", "100%");
  const xAt = (x) => left + (xs.indexOf(x) * (width - left - 10)) / Math.max(1, xs.length - 1);
  const yAt = (y) => 10 + (height - bottom - 10) * (1 - Number(y) / top);
  series.forEach((name, i) => {
    const line = points.filter((point) => (point[component.series] ?? "all") === name);
    const path = document.createElementNS(svg.namespaceURI, "polyline");
    path.setAttribute("points", line.map((point) => `${xAt(point[component.x])},${yAt(point[component.y])}`).join(" "));
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", PALETTE[i % PALETTE.length]);
    path.setAttribute("stroke-width", "2");
    svg.append(path);
  });
  xs.forEach((x, i) => {
    if (i % Math.ceil(xs.length / 6)) return;
    const label = document.createElementNS(svg.namespaceURI, "text");
    label.setAttribute("x", xAt(x)); label.setAttribute("y", height - 6);
    label.setAttribute("font-size", "11"); label.setAttribute("fill", "#6b7280");
    label.textContent = x;
    svg.append(label);
  });
  const card = element("div", undefined, "card");
  const title = component.title ?? plainWords(`${component.y} by ${component.x}`);
  card.append(element("h3", title), svg);
  return card;
}

function drawAssumptions(surface, component) {
  const card = element("div", undefined, "card");
  card.append(element("h3", "Assumptions"));
  const list = element("ul");
  for (const item of resolved(surface, component.items) || []) list.append(element("li", item));
  card.append(list);
  return card;
}

function drawQuote(surface, component) {
  const card = element("div", undefined, "card quote");
  card.append(element("p", `"${resolved(surface, component.quote)}"`));
  const gloss = resolved(surface, component.gloss);
  if (gloss) card.append(element("small", `${gloss} `));
  card.append(element("small", `Review ${resolved(surface, component.reviewId)}`));
  return card;
}

function draw(surface, id) {
  const component = surface.components[id];
  if (!component) {
    console.log(`Missing component: ${id}`);
    return element("div", "This part of the answer did not arrive. Ask the question again.");
  }
  if (component.component === "Column") {
    const column = element("div", undefined, "column");
    for (const child of component.children) column.append(draw(surface, child));
    return column;
  }
  if (component.component === "Text") return element("p", resolved(surface, component.text));
  if (component.component === "Table") return drawTable(surface, component);
  if (component.component === "LineChart") return drawChart(surface, component);
  if (component.component === "AssumptionCard") return drawAssumptions(surface, component);
  if (component.component === "ReviewQuote") return drawQuote(surface, component);
  console.log(`Not in the catalog: ${component.component}`);
  return element("div", "The desk cannot draw this part of the answer. Ask the question again.");
}

function show() {
  const target = document.getElementById("surface");
  const surface = Object.values(surfaces).pop();
  if (!surface?.components.root) return;
  target.className = "";
  target.replaceChildren(draw(surface, "root"));
}

function logEvent(event, startedAt) {
  const seconds = ((performance.now() - startedAt) / 1000).toFixed(1);
  const line = element("div");
  line.append(element("b", event.type), ` ${seconds}s`);
  document.getElementById("events").append(line);
  if (event.type === "TOOL_CALL_START") {
    document.getElementById("surface").textContent = `Working: ${plainWords(event.toolCallName)}`;
  }
  if (event.type === "ACTIVITY_SNAPSHOT" && event.activityType === "a2ui-surface") {
    for (const message of event.content.a2ui_operations) apply(message);
    show();
  }
}

async function ask(question) {
  document.getElementById("events").replaceChildren();
  const startedAt = performance.now();
  const response = await fetch("/ask", {
    method: "POST",
    headers: new Headers([
      ["Content-Type", "application/json"],
      ["Accept", "text/event-stream"],
    ]),
    body: JSON.stringify({ question }),
  });
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const blocks = buffer.split("\n\n");
    buffer = blocks.pop();
    for (const block of blocks) {
      const data = block.split("\n").find((line) => line.startsWith("data: "));
      if (data) logEvent(JSON.parse(data.slice(6)), startedAt);
    }
  }
}

document.getElementById("ask").addEventListener("submit", (submitted) => {
  submitted.preventDefault();
  ask(document.getElementById("question").value);
});

if (PRESET_MESSAGES) {
  document.getElementById("ask").remove();
  for (const message of PRESET_MESSAGES) apply(message);
  show();
}
</script>
</body>
</html>
