[project]
name = "agentic-commerce-data"
version = "0.1.0"
description = "Course repo: a marketplace data agent on the Olist data, checked on rows, not prose."
requires-python = ">=3.12"
dependencies = [
  "litellm==1.109.1",
  "python-dotenv==1.2.4",
  "sqlglot==30.31.0",
]

[project.scripts]
ask = "agent.ask:main"
ask-naive = "desk.naive:main"
ask-finished = "desk.finished.cli:main"
models = "desk.models_cli:main"

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["agent", "config", "desk"]

# Python steps follow the same readable-code rules as TypeScript. See STANDARD.md, "Readable code".
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "SIM", "C90", "PLR0913", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 30
max-nested-blocks = 3
