# Where the Olist data comes from. `bun run world` downloads each file, checks its SHA-256, and builds data/olist.db.
# The data is NOT stored in this repo.
#
# Dataset: "Brazilian E-Commerce Public Dataset by Olist", published by Olist on Kaggle:
#   https://www.kaggle.com/datasets/olistbr/brazilian-ecommerce
# Licence: CC BY-NC-SA 4.0, https://creativecommons.org/licenses/by-nc-sa/4.0/
#
# The download is pinned to one commit of a public GitHub copy of the Kaggle files, so every learner and CI
# build the same bytes without a Kaggle account. If you prefer, download the zip from Kaggle with your own
# account, unzip the CSVs into world/.cache/, and `bun run world` uses them if their checksums match.

[source]
base = "https://raw.githubusercontent.com/tunguyenn99/ecommerce-data-modeling/63401c2739ae42dd9bbfa7e20227fe7b7de725a3/dataset"
commit = "63401c2739ae42dd9bbfa7e20227fe7b7de725a3"
kaggle = "https://www.kaggle.com/datasets/olistbr/brazilian-ecommerce"
licence = "CC BY-NC-SA 4.0"

