# Parts mapped onto formats. This is the only file that holds time. Every format covers all 431 minutes of steps (396 core, 15 and 20 homework).
# Part minutes: orientation 15, score-the-naive-agent 47, lock-the-database 42, define-the-metrics 35,
# retrieve-the-context 45, build-the-loop 55, answer-with-ui 40, approve-the-write 25, delegate-over-a2a 35,
# gate-every-change 57, serve-the-logistics-agent-with-a2a-sdk 15, track-changed-facts-with-graphiti 20.

# One day: four blocks, 396 minutes of steps, plus breaks of 15, 45 and 15 minutes (475 on the clock, 09:30 to 17:25).
[one-day]
sessions = [
  { label = "09:30", parts = ["orientation", "score-the-naive-agent", "lock-the-database"], minutes = 105 },
  { label = "11:30 after a 15 minute break", parts = ["define-the-metrics", "retrieve-the-context"], minutes = 80 },
  { label = "13:35 after a 45 minute lunch", parts = ["build-the-loop", "answer-with-ui"], minutes = 95 },
  { label = "15:25 after a 15 minute break", parts = ["approve-the-write", "delegate-over-a2a", "gate-every-change"], minutes = 120 },
  { label = "homework, optional in the live session", parts = ["serve-the-logistics-agent-with-a2a-sdk"], minutes = 15 },
  { label = "homework: track changed facts with Graphiti", parts = ["track-changed-facts-with-graphiti"], minutes = 20 },
]

# Four evenings. Each ends on a green `bun run verify part <name>`, so the next starts from a known state.
[four-evenings]
sessions = [
  { label = "evening 1", parts = ["orientation", "score-the-naive-agent", "lock-the-database"], minutes = 105 },
  { label = "evening 2", parts = ["define-the-metrics", "retrieve-the-context"], minutes = 80 },
  { label = "evening 3", parts = ["build-the-loop", "answer-with-ui"], minutes = 95 },
  { label = "evening 4", parts = ["approve-the-write", "delegate-over-a2a", "gate-every-change"], minutes = 120 },
  { label = "homework, optional in the live session", parts = ["serve-the-logistics-agent-with-a2a-sdk"], minutes = 15 },
  { label = "homework: track changed facts with Graphiti", parts = ["track-changed-facts-with-graphiti"], minutes = 20 },
]

# Six weekly sessions, each with a take-home extension that is not graded in the core flow.
[six-weekly-sessions]
sessions = [
  { label = "week 1: add 5 golden questions from your own work", parts = ["orientation", "score-the-naive-agent"], minutes = 65 },
  { label = "week 2: write two more metrics with an owner each", parts = ["lock-the-database", "define-the-metrics"], minutes = 80 },
  { label = "week 3: add the Marketing Funnel tables and their cards", parts = ["retrieve-the-context"], minutes = 45 },
  { label = "week 4: an adversarial reviewer pass with a token cost check", parts = ["build-the-loop"], minutes = 55 },
  { label = "week 5: add one component to the renderer catalog", parts = ["answer-with-ui", "approve-the-write"], minutes = 65 },
  { label = "week 6: move to Postgres with a read-only role", parts = ["delegate-over-a2a", "gate-every-change"], minutes = 95 },
  { label = "homework, optional in the live session", parts = ["serve-the-logistics-agent-with-a2a-sdk"], minutes = 15 },
  { label = "homework: track changed facts with Graphiti", parts = ["track-changed-facts-with-graphiti"], minutes = 20 },
]
